services:
  - type: web
    name: amp-trade-find-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_VERSION
        value: 0.9.3
      - key: PAPER_MODE
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/amp_trade_find.db
      - key: PERSISTENT_DATA_DIR
        value: /var/data
      - key: PERSISTENT_PROBE_FILE
        value: /var/data/amp_find_persistence_probe.json
      - key: FIREBASE_ENABLED
        value: "false"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
